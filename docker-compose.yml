version: '3.8'
services:
  app:
    build: .
    container_name: sentinel-trader
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./dashboard:/app/dashboard
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    command: python main.py
    networks:
      - sentinel
    
  nginx:
    image: nginx:alpine
    container_name: sentinel-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - sentinel

networks:
  sentinel:
    driver: bridge
