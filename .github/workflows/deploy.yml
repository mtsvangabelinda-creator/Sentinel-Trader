name: Deploy SentinelTrader to Oracle Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allows manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Create .env file from secrets
        run: |
          cat > .env << EOF
          KRAKEN_API_KEY=${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_SECRET=${{ secrets.KRAKEN_SECRET }}
          TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          EOF
          chmod 600 .env
          echo "✅ .env file created"
      
      - name: Deploy to Oracle Cloud VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 Starting deployment..."
            
            # Navigate to project
            cd ~/SentinelTrader || mkdir -p ~/SentinelTrader && cd ~/SentinelTrader
            
            # Pull latest code
            if [ -d .git ]; then
              git pull origin main
            else
              git clone https://github.com/${{ github.repository }}.git .
            fi
            
            # Create .env file
            cat > .env << 'ENVEOF'
            KRAKEN_API_KEY=${{ secrets.KRAKEN_API_KEY }}
            KRAKEN_SECRET=${{ secrets.KRAKEN_SECRET }}
            TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}
            TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
            ENVEOF
            chmod 600 .env
            
            # Stop old containers
            docker-compose down || true
            
            # Clean up old images
            docker image prune -f || true
            
            # Build and start
            docker-compose up -d --build
            
            # Wait for startup
            sleep 10
            
            # Check status
            docker-compose ps
            docker-compose logs app | head -50
            
            echo "✅ Deployment complete"
      
      - name: Notify on success
        if: success()
        run: echo "🟢 SentinelTrader deployed successfully"
      
      - name: Notify on failure
        if: failure()
        run: echo "🔴 Deployment failed - check logs"
