- name: Deploy to Oracle Cloud VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          timeout: 20m
          command_timeout: 20m
          script: |
            set -e
            echo "🚀 Starting deployment..."
            
            # Install Docker if needed
            if ! command -v docker &> /dev/null; then
              echo "📦 Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose
              sudo usermod -aG docker ubuntu
              sudo systemctl restart docker
            fi
            
            export DOCKER_BUILDKIT=1
            
            newgrp docker << 'DOCKER_COMMANDS'
            
            cd ~/SentinelTrader || (mkdir -p ~/SentinelTrader && cd ~/SentinelTrader && git clone https://github.com/${{ github.repository }}.git .)
            
            git pull origin main || true
            
            # Combine CSV parts if they exist
            echo "📥 Checking for CSV parts..."
            if ls data/btcusd_bitstamp_1min_latest.csv.part* 1> /dev/null 2>&1; then
              echo "Combining CSV parts..."
              cd data
              cat btcusd_bitstamp_1min_latest.csv.part* > btcusd_bitstamp_1min_latest.csv
              rm btcusd_bitstamp_1min_latest.csv.part*
              cd ..
              echo "✅ CSV combined successfully"
            elif [ -f "data/btcusd_bitstamp_1min_latest.csv.zip" ]; then
              echo "Extracting CSV..."
              cd data
              unzip -o btcusd_bitstamp_1min_latest.csv.zip
              cd ..
              echo "✅ CSV extracted"
            fi
            
            cat > .env << 'ENVEOF'
            KRAKEN_API_KEY=${{ secrets.KRAKEN_API_KEY }}
            KRAKEN_SECRET=${{ secrets.KRAKEN_SECRET }}
            TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}
            TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
            ENVEOF
            chmod 600 .env
            
            docker-compose down || true
            docker image prune -f -a --filter "until=24h" || true
            
            echo "🔨 Building and starting..."
            export DOCKER_BUILDKIT=1
            docker-compose up -d --build
            
            sleep 15
            
            echo "📊 Status:"
            docker-compose ps
            docker-compose logs app | tail -50
            
            echo "✅ Deployment complete!"
            
            DOCKER_COMMANDS
