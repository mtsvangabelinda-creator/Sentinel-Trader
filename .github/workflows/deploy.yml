name: Deploy SentinelTrader

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to Oracle
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          KEY: ${{ secrets.ORACLE_KEY }}
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@$HOST bash << 'DEPLOY'
          cd ~/sentineltrader || git clone https://github.com/${{ github.repository }}.git ~/sentineltrader
          cd ~/sentineltrader
          git pull origin main
          cat > .env << EOF
          KRAKEN_API_KEY=$KRAKEN_API_KEY
          KRAKEN_API_SECRET=$KRAKEN_API_SECRET
          TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN
          TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID
          DATABASE_URL=postgresql://sentineltrader_user:sentineltrader_password@postgres:5432/sentineltrader_db
          REDIS_URL=redis://redis:6379
          ENVIRONMENT=production
          EOF
          docker-compose down || true
          docker-compose up -d
          echo "✅ Deployment successful"
          DEPLOY
