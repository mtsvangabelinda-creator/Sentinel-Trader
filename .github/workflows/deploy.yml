name: Deploy SentinelTrader to Oracle Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      
      - name: Create .env file from secrets
        run: |
          cat > .env << EOF
          KRAKEN_API_KEY=${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_SECRET=${{ secrets.KRAKEN_SECRET }}
          TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          EOF
          chmod 600 .env
          echo "✅ .env file created"
      
      - name: Deploy to Oracle Cloud VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 Starting deployment..."
            
            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              echo "📦 Installing Docker and Docker Compose..."
              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose
              sudo usermod -aG docker ubuntu
              sudo systemctl restart docker
              echo "✅ Docker installed successfully"
            else
              echo "✅ Docker already installed"
            fi
            
            # Activate docker group for current session
            newgrp docker << 'DOCKER_COMMANDS'
            
            # Navigate to project
            cd ~/SentinelTrader || (mkdir -p ~/SentinelTrader && cd ~/SentinelTrader && git clone https://github.com/${{ github.repository }}.git .)
            
            # Pull latest code
            git pull origin main || true
            
            # Initialize and update git submodules
            echo "📥 Initializing git submodules..."
            git submodule update --init --recursive || true
            
            # Create data directory if it doesn't exist
            mkdir -p data
            
            # Create symlink to CSV from submodule
            echo "🔗 Creating symlink to bitstamp data..."
            if [ -f "data/bitstamp/data/csv/bitstamp_btcusd_1min_data.csv" ]; then
              ln -sf ../bitstamp/data/csv/bitstamp_btcusd_1min_data.csv data/btcusd_bitstamp_1min_latest.csv
              echo "✅ Symlink created successfully"
            else
              echo "⚠️  Bitstamp CSV not found, system will use downloaded data"
            fi
            
            # Create .env file
            cat > .env << 'ENVEOF'
            KRAKEN_API_KEY=${{ secrets.KRAKEN_API_KEY }}
            KRAKEN_SECRET=${{ secrets.KRAKEN_SECRET }}
            TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}
            TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
            ENVEOF
            chmod 600 .env
            echo "✅ .env file created"
            
            # Stop old containers
            docker-compose down || true
            
            # Clean up old images
            docker image prune -f || true
            
            # Build and start
            echo "🔨 Building and starting containers..."
            docker-compose up -d --build
            
            # Wait for startup
            sleep 10
            
            # Check status
            echo "📊 Container status:"
            docker-compose ps
            
            echo "📋 Recent logs:"
            docker-compose logs app | head -50
            
            echo "✅ Deployment complete!"
            
            DOCKER_COMMANDS
