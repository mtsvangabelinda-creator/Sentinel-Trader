name: Deploy SentinelTrader to Oracle Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to Oracle Cloud VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          timeout: 20m
          command_timeout: 20m
          script: |
            set -e
            echo "🚀 Starting deployment..."
            
            if ! command -v docker &> /dev/null; then
              echo "📦 Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose
              sudo usermod -aG docker ubuntu
              sudo systemctl restart docker
            fi
            
            cd ~/SentinelTrader || (mkdir -p ~/SentinelTrader && cd ~/SentinelTrader && git clone https://github.com/${{ github.repository }}.git .)
            
            git pull origin main || true
            
            # Create data directory
            mkdir -p data
            
            # Extract CSV from root directory with correct filename
            if [ -f "btcusd_bitstamp_1min_clean_2024_2026.csv.gz" ]; then
              echo "📥 Extracting CSV..."
              gunzip -c btcusd_bitstamp_1min_clean_2024_2026.csv.gz > data/btc_usd_1m.csv
              echo "✅ CSV extracted successfully to data/btc_usd_1m.csv"
            else
              echo "❌ CSV file not found: btcusd_bitstamp_1min_clean_2024_2026.csv.gz"
              echo "Available files:"
              ls -la *.gz 2>/dev/null || echo "No .gz files found"
              exit 1
            fi
            
            # Verify CSV exists
            if [ -f "data/btc_usd_1m.csv" ]; then
              echo "✅ CSV file verified at data/btc_usd_1m.csv"
              echo "CSV size: $(du -h data/btc_usd_1m.csv | cut -f1)"
            else
              echo "❌ CSV extraction failed"
              exit 1
            fi
            
            # Create .env file
            cat > .env << 'ENVEOF'
            KRAKEN_API_KEY=${{ secrets.KRAKEN_API_KEY }}
            KRAKEN_SECRET=${{ secrets.KRAKEN_SECRET }}
            TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}
            TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
            ENVEOF
            chmod 600 .env
            
            # Add ubuntu to docker group and refresh
            newgrp docker << 'DOCKER_COMMANDS'
            
            # Stop old containers
            docker-compose down || true
            
            # Clean up old images
            docker image prune -f -a --filter "until=24h" || true
            
            # Build and start containers
            echo "🔨 Building and starting containers..."
            docker-compose up -d --build
            
            sleep 15
            
            echo "📊 Container status:"
            docker-compose ps
            
            echo "📋 Application logs:"
            docker-compose logs app | tail -100
            
            echo "✅ Deployment complete!"
            
            DOCKER_COMMANDS
